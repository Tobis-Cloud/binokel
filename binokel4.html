<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binokel Profi-Zähler</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Binokel Profi">
    
    <link rel="apple-touch-icon" href="Binokel.jpeg">
    <link rel="icon" type="image/jpeg" href="Binokel.jpeg">

    <style>
        /* SOFT MODERN NEON DESIGN TOKENS */
        :root {
            --bg-black: #050505;
            
            /* Pastel Neon Colors */
            --neon-blue: #3b82f6;
            --neon-orange: #ff9f0a;
            --neon-green: #30d158;
            --neon-purple: #b666ff;
            --neon-red: #ff6b6b;
            
            /* Ambient Glows */
            --glow-blue: 0 0 15px rgba(59, 130, 246, 0.35), 0 0 35px rgba(59, 130, 246, 0.15);
            --glow-orange: 0 0 15px rgba(255, 159, 10, 0.35), 0 0 35px rgba(255, 159, 10, 0.15);
            --glow-green: 0 0 15px rgba(48, 209, 88, 0.35), 0 0 35px rgba(48, 209, 88, 0.15);
            --glow-purple: 0 0 15px rgba(182, 102, 255, 0.35), 0 0 35px rgba(182, 102, 255, 0.15);
            --glow-red: 0 0 15px rgba(255, 107, 107, 0.35), 0 0 35px rgba(255, 107, 107, 0.15);
            
            --glow-text-purple: 0 0 8px rgba(182, 102, 255, 0.5), 0 0 25px rgba(182, 102, 255, 0.2);

            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-fast: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(182, 102, 255, 0.06) 0%, rgba(59, 130, 246, 0.03) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none;
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            color: #ffffff;
            text-shadow: var(--glow-text-purple);
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* STICKY HEADER */
        .header-sticky {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: var(--bg-black);
            padding-bottom: 12px;
        }

        .score-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-fast);
        }
        
        .team-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .total-score {
            font-size: 2rem;
            font-weight: 200;
        }
        
        .score-wir { border-top: 3px solid var(--neon-blue); color: var(--neon-blue); box-shadow: inset 0 4px 12px rgba(59, 130, 246, 0.05); }
        .score-die { border-top: 3px solid var(--neon-orange); color: var(--neon-orange); box-shadow: inset 0 4px 12px rgba(255, 159, 10, 0.05); }

        .current-bid-display {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }
        .current-bid-display strong {
            color: #ffffff;
        }

        /* CARDS & PHASES */
        .phase-card {
            background: rgba(8, 8, 8, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .phase-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        label {
            font-size: 0.8rem;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FORM CONTROLS */
        select, input[type="number"], input[type="text"] {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }
        input[type="text"] {
            text-align: left;
            padding-left: 14px;
        }
        select:focus, input:focus {
            border-color: rgba(182, 102, 255, 0.5);
            background: rgba(182, 102, 255, 0.04);
        }

        /* BUTTONS WITH SOFT GLOWS */
        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(48, 209, 88, 0.5);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all var(--transition-fast);
            box-shadow: var(--glow-green);
            text-shadow: 0 0 3px #ffffff;
        }
        .btn:hover { background: rgba(48, 209, 88, 0.1); }
        .btn:active { transform: scale(0.98); }

        .btn-blue {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: var(--glow-blue);
        }
        .btn-blue:hover { background: rgba(59, 130, 246, 0.1); }

        .btn-danger {
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: var(--glow-red);
        }
        .btn-danger:hover { background: rgba(255, 107, 107, 0.1); }

        .btn-purple {
            border-color: rgba(182, 102, 255, 0.5);
            box-shadow: var(--glow-purple);
        }
        .btn-purple:hover { background: rgba(182, 102, 255, 0.1); }

        /* BOX INDICATORS */
        .info-box {
            background-color: rgba(59, 130, 246, 0.03);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 0.9rem;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .result-box {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .success {
            background-color: rgba(48, 209, 88, 0.05);
            border: 1px solid rgba(48, 209, 88, 0.4);
            color: var(--neon-green);
            box-shadow: var(--glow-green);
        }
        .fail {
            background-color: rgba(255, 107, 107, 0.05);
            border: 1px solid rgba(255, 107, 107, 0.4);
            color: var(--neon-red);
            box-shadow: var(--glow-red);
        }

        /* HISTORY */
        .history {
            background: rgba(8, 8, 8, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }
        .history-row:last-of-type {
            border-bottom: none;
        }

        .reset-btn {
            width: 100%;
            padding: 0.8rem;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 15px;
        }
        .reset-btn:hover {
            border-color: var(--neon-red);
            color: #ffffff;
            box-shadow: var(--glow-red);
            background: rgba(255, 107, 107, 0.05);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="wrapper">
        <h1>Binokel Rechner</h1>

        <!-- STICKY SCORE BOARD -->
        <div class="header-sticky">
            <div class="score-board">
                <div class="team-card score-wir">
                    <div class="team-title" id="lblScoreWir">Wir</div>
                    <div class="total-score" id="scoreWir">0</div>
                </div>
                <div class="team-card score-die">
                    <div class="team-title" id="lblScoreDie">Die</div>
                    <div class="total-score" id="scoreDie">0</div>
                </div>
            </div>
            <div class="current-bid-display" id="bidDisplay">Kein aktives Spiel</div>
        </div>

        <!-- PHASE 0: SETUP TEAM NAMES -->
        <div class="phase-card" id="p0">
            <div class="phase-title">Namen vergeben</div>
            <div class="grid-2" style="margin-bottom: 15px;">
                <div>
                    <label style="color: var(--neon-blue);">Name Team 1:</label>
                    <input type="text" id="nameTeamWir" value="Wir" placeholder="z.B. Wir" oninput="saveCurrentInputs()">
                </div>
                <div>
                    <label style="color: var(--neon-orange);">Name Team 2:</label>
                    <input type="text" id="nameTeamDie" value="Die" placeholder="z.B. Die" oninput="saveCurrentInputs()">
                </div>
            </div>
            <button class="btn btn-blue" onclick="saveNamesAndStart()">Spiel starten</button>
        </div>

        <!-- PHASE 1: OWNER AND BID -->
        <div class="phase-card" id="p1" style="display:none;">
            <div class="phase-title">1. Wer hat das Spiel?</div>
            <div class="flex-row">
                <select id="gameOwner" onchange="saveCurrentInputs()">
                </select>
                <input type="number" id="bidAmount" placeholder="Reizwert (z.B. 200)" pattern="[0-9]*" oninput="saveCurrentInputs()">
            </div>
            <button class="btn btn-blue" onclick="goToPhase2()">Weiter zum Melden</button>
        </div>

        <!-- PHASE 2: MELDUNGEN & SPECIALS -->
        <div class="phase-card" id="p2" style="display:none;">
            <div class="phase-title">2. Wie viel wurde gemeldet?</div>
            <div class="grid-2">
                <div>
                    <label style="color: var(--neon-blue);" id="lblMeldWir">Melden Team 1:</label>
                    <input type="number" id="meldWir" placeholder="0" pattern="[0-9]*" oninput="updateTargetStiche(); saveCurrentInputs();">
                </div>
                <div>
                    <label style="color: var(--neon-orange);" id="lblMeldDie">Melden Team 2:</label>
                    <input type="number" id="meldDie" placeholder="0" pattern="[0-9]*" oninput="updateTargetStiche(); saveCurrentInputs();">
                </div>
            </div>
            
            <div id="targetSticheBox" class="info-box" style="display:none;"></div>
            
            <button class="btn btn-blue" style="margin-top: 10px;" onclick="goToPhase3()">Zu den normalen Stichen</button>
            
            <div style="border-top: 1px solid rgba(255,255,255,0.05); margin-top: 18px; padding-top: 12px;">
                <label style="font-size: 11px; color: rgba(255,255,255,0.3); text-align: center; margin-bottom: 8px;">Sonder-Ansagen (Kein Melden / Stiche zählen):</label>
                <div class="grid-2">
                    <button class="btn btn-purple" onclick="handleSpecialGame('durch')">Durch</button>
                    <button class="btn btn-purple" onclick="handleSpecialGame('untendurch')">Untendurch</button>
                </div>
                <button class="btn btn-danger" style="margin-top: 12px;" onclick="handleStotiert()">Spieler stotiert (Einfach Minus + Gegner-Meldung)</button>
            </div>
        </div>

        <!-- PHASE 3: POINTS -->
        <div class="phase-card" id="p3" style="display:none;">
            <div class="phase-title">3. Erspielte Augen im Match (Gesamt: 240)</div>
            <div class="grid-2">
                <div>
                    <label style="color: var(--neon-blue);" id="lblSticheWir">Augen Team 1:</label>
                    <input type="number" id="pointsWir" placeholder="0" pattern="[0-9]*" oninput="calcPoints('Wir'); saveCurrentInputs();">
                </div>
                <div>
                    <label style="color: var(--neon-orange);" id="lblSticheDie">Augen Team 2:</label>
                    <input type="number" id="pointsDie" placeholder="0" pattern="[0-9]*" oninput="calcPoints('Die'); saveCurrentInputs();">
                </div>
            </div>
            
            <div class="flex-row" style="margin-top: 18px; justify-content: space-between; gap: 5px;">
                <label style="margin-bottom: 0; text-align: left;">Letzter Stich (+10):</label>
                <select id="lastStich" style="width: auto; padding: 8px 16px;" onchange="recalcBoth(); saveCurrentInputs();">
                </select>
            </div>
            <button class="btn btn-blue" style="margin-top: 10px;" onclick="calculateResult()">Spiel auswerten</button>
        </div>

        <!-- SPECIAL PHASE -->
        <div class="phase-card" id="pSpecial" style="display:none;">
            <div class="phase-title" id="specialTitle">Sonderprüfung</div>
            <p style="text-align: center; font-size: 1.1rem; font-weight: 300; margin: 10px 0;" id="specialPrompt">Geschafft?</p>
            <div class="grid-2" style="margin-top: 15px;">
                <button class="btn" style="padding: 14px;" onclick="evaluateSpecial(true)">JA, geschafft!</button>
                <button class="btn btn-danger" style="padding: 14px;" onclick="evaluateSpecial(false)">NEIN, verloren</button>
            </div>
        </div>

        <!-- PHASE 4: RESULT -->
        <div class="phase-card" id="p4" style="display:none;">
            <div class="phase-title">4. Rundenergebnis</div>
            <div id="resultStatus"></div>
            
            <div class="grid-2" style="margin-top: 20px; text-align: center;">
                <div>
                    <span style="color: var(--neon-blue); font-weight: 600;" id="lblGainWir">Team 1 erhält:</span>
                    <div id="roundGainWir" style="font-size: 1.4rem; font-weight: 300; margin-top: 4px;">0</div>
                </div>
                <div>
                    <span style="color: var(--neon-orange); font-weight: 600;" id="lblGainDie">Team 2 erhält:</span>
                    <div id="roundGainDie" style="font-size: 1.4rem; font-weight: 300; margin-top: 4px;">0</div>
                </div>
            </div>
            <button class="btn" style="margin-top: 20px;" onclick="applyAndReset()">Punkte anschreiben & Nächste Runde</button>
        </div>

        <!-- ROUND HISTORY -->
        <div class="history">
            <div class="phase-title">Rundenverlauf</div>
            <div id="historyList"></div>
            <button class="reset-btn" onclick="triggerNewGameSetup()">Neues Spiel starten</button>
        </div>
    </div>

    <script>
        let totalWir = parseInt(localStorage.getItem('bp_wir')) || 0;
        let totalDie = parseInt(localStorage.getItem('bp_die')) || 0;
        let history = JSON.parse(localStorage.getItem('bp_history')) || [];
        
        let nameWir = localStorage.getItem('bp_name_wir') || "Wir";
        let nameDie = localStorage.getItem('bp_name_die') || "Die";
        
        let roundData = JSON.parse(localStorage.getItem('bp_roundData')) || {};
        let activeSpecialType = localStorage.getItem('bp_activeSpecialType') || '';

        function save() {
            localStorage.setItem('bp_wir', totalWir);
            localStorage.setItem('bp_die', totalDie);
            localStorage.setItem('bp_history', JSON.stringify(history));
            localStorage.setItem('bp_name_wir', nameWir);
            localStorage.setItem('bp_name_die', nameDie);
        }

        function saveCurrentInputs() {
            const inputs = {
                nameTeamWir: document.getElementById('nameTeamWir').value,
                nameTeamDie: document.getElementById('nameTeamDie').value,
                gameOwner: document.getElementById('gameOwner').value,
                bidAmount: document.getElementById('bidAmount').value,
                meldWir: document.getElementById('meldWir').value,
                meldDie: document.getElementById('meldDie').value,
                pointsWir: document.getElementById('pointsWir').value,
                pointsDie: document.getElementById('pointsDie').value,
                lastStich: document.getElementById('lastStich').value,
                activePhase: getActivePhaseId(),
                bidDisplayHtml: document.getElementById('bidDisplay').innerHTML,
                targetSticheHtml: document.getElementById('targetSticheBox').innerHTML,
                targetSticheDisplay: document.getElementById('targetSticheBox').style.display,
                resultStatusHtml: document.getElementById('resultStatus').innerHTML,
                resultStatusClass: document.getElementById('resultStatus').className,
                roundGainWir: document.getElementById('roundGainWir').innerText,
                roundGainDie: document.getElementById('roundGainDie').innerText,
                specialTitle: document.getElementById('specialTitle').innerText,
                specialPrompt: document.getElementById('specialPrompt').innerText
            };
            localStorage.setItem('bp_current_inputs', JSON.stringify(inputs));
            localStorage.setItem('bp_roundData', JSON.stringify(roundData));
            localStorage.setItem('bp_activeSpecialType', activeSpecialType);
        }

        function loadCurrentInputs() {
            const saved = localStorage.getItem('bp_current_inputs');
            if (!saved) return;
            const inputs = JSON.parse(saved);

            document.getElementById('nameTeamWir').value = inputs.nameTeamWir || 'Wir';
            document.getElementById('nameTeamDie').value = inputs.nameTeamDie || 'Die';
            document.getElementById('gameOwner').value = inputs.gameOwner || 'Wir';
            document.getElementById('bidAmount').value = inputs.bidAmount || '';
            document.getElementById('meldWir').value = inputs.meldWir || '';
            document.getElementById('meldDie').value = inputs.meldDie || '';
            document.getElementById('pointsWir').value = inputs.pointsWir || '';
            document.getElementById('pointsDie').value = inputs.pointsDie || '';
            document.getElementById('lastStich').value = inputs.lastStich || 'Wir';
            
            if (inputs.bidDisplayHtml) document.getElementById('bidDisplay').innerHTML = inputs.bidDisplayHtml;
            if (inputs.targetSticheHtml) document.getElementById('targetSticheBox').innerHTML = inputs.targetSticheHtml;
            if (inputs.targetSticheDisplay) document.getElementById('targetSticheBox').style.display = inputs.targetSticheDisplay;
            if (inputs.resultStatusHtml) document.getElementById('resultStatus').innerHTML = inputs.resultStatusHtml;
            if (inputs.resultStatusClass) document.getElementById('resultStatus').className = inputs.resultStatusClass;
            if (inputs.roundGainWir) document.getElementById('roundGainWir').innerText = inputs.roundGainWir;
            if (inputs.roundGainDie) document.getElementById('roundGainDie').innerText = inputs.roundGainDie;
            if (inputs.specialTitle) document.getElementById('specialTitle').innerText = inputs.specialTitle;
            if (inputs.specialPrompt) document.getElementById('specialPrompt').innerText = inputs.specialPrompt;

            if (inputs.activePhase) {
                ['p0', 'p1', 'p2', 'p3', 'pSpecial', 'p4'].forEach(p => document.getElementById(p).style.display = 'none');
                document.getElementById(inputs.activePhase).style.display = 'block';
            }
        }

        function getActivePhaseId() {
            if (document.getElementById('p0').style.display !== 'none') return 'p0';
            if (document.getElementById('p1').style.display !== 'none') return 'p1';
            if (document.getElementById('p2').style.display !== 'none') return 'p2';
            if (document.getElementById('p3').style.display !== 'none') return 'p3';
            if (document.getElementById('pSpecial').style.display !== 'none') return 'pSpecial';
            if (document.getElementById('p4').style.display !== 'none') return 'p4';
            return 'p1';
        }

        function clearCurrentInputs() {
            localStorage.removeItem('bp_current_inputs');
            localStorage.removeItem('bp_roundData');
            localStorage.removeItem('bp_activeSpecialType');
            roundData = {};
            activeSpecialType = '';
        }

        function applyNamesToUI() {
            document.getElementById('lblScoreWir').innerText = nameWir;
            document.getElementById('lblScoreDie').innerText = nameDie;
            
            document.getElementById('lblMeldWir').innerText = "Melden " + nameWir + ":";
            document.getElementById('lblMeldDie').innerText = "Melden " + nameDie + ":";
            
            document.getElementById('lblSticheWir').innerText = "Augen " + nameWir + ":";
            document.getElementById('lblSticheDie').innerText = "Augen " + nameDie + ":";
            
            document.getElementById('lblGainWir').innerText = nameWir + " erhält:";
            document.getElementById('lblGainDie').innerText = nameDie + " erhält:";
            
            const ownerSelect = document.getElementById('gameOwner');
            ownerSelect.innerHTML = `<option value="Wir">${nameWir}</option><option value="Die">${nameDie}</option>`;
            
            const lastStichSelect = document.getElementById('lastStich');
            lastStichSelect.innerHTML = `<option value="Wir">${nameWir}</option><option value="Die">${nameDie}</option>`;
        }

        function saveNamesAndStart() {
            const inputWir = document.getElementById('nameTeamWir').value.trim();
            const inputDie = document.getElementById('nameTeamDie').value.trim();
            
            nameWir = inputWir !== "" ? inputWir : "Wir";
            nameDie = inputDie !== "" ? inputDie : "Die";
            
            save();
            applyNamesToUI();
            updateDisplay();
            
            document.getElementById('p0').style.display = 'none';
            document.getElementById('p1').style.display = 'block';
            saveCurrentInputs();
        }

        function updateDisplay() {
            document.getElementById('scoreWir').innerText = totalWir;
            document.getElementById('scoreDie').innerText = totalDie;
            
            const histList = document.getElementById('historyList');
            histList.innerHTML = '';
            history.forEach((r, idx) => {
                let statusText = '';
                if(r.stotiert) statusText = ' - Stotiert (Einfach)';
                else if(r.special) statusText = ` - ${r.special}`;
                else if(r.verloren) statusText = ' - Verloren (Doppelt)';

                let displayOwner = (r.owner === 'Wir') ? nameWir : nameDie;

                histList.innerHTML += `
                    <div class="history-row">
                        <span>Runde ${idx + 1} (${displayOwner}: ${r.bid}${statusText})</span>
                        <div style="font-weight: 600;">
                            <span style="color: var(--neon-blue); margin-right: 12px;">${r.wir >= 0 ? '+' + r.wir : r.wir}</span>
                            <span style="color: var(--neon-orange);">${r.die >= 0 ? '+' + r.die : r.die}</span>
                        </div>
                    </div>`;
            });
        }

        function updateBidDisplay() {
            const owner = document.getElementById('gameOwner').value;
            const bid = parseInt(document.getElementById('bidAmount').value) || 0;
            const inputWir = document.getElementById('meldWir').value;
            const inputDie = document.getElementById('meldDie').value;
            
            const displayName = (owner === 'Wir') ? nameWir : nameDie;
            const activeInput = (owner === 'Wir') ? inputWir : inputDie;
            
            if (activeInput !== '' && !isNaN(activeInput)) {
                document.getElementById('bidDisplay').innerHTML = `Aktuelles Spiel: <strong>${displayName}</strong> spielt für <strong>${bid}</strong> (Gemeldet: <strong>${activeInput}</strong>)`;
            } else {
                document.getElementById('bidDisplay').innerHTML = `Aktuelles Spiel: <strong>${displayName}</strong> spielt für <strong>${bid}</strong>`;
            }
        }

        function goToPhase2() {
            const bid = parseInt(document.getElementById('bidAmount').value);
            if (isNaN(bid) || bid <= 0) { alert("Bitte einen gültigen Reizwert eingeben!"); return; }
            
            updateBidDisplay();
            
            document.getElementById('p1').style.display = 'none';
            document.getElementById('p2').style.display = 'block';
            document.getElementById('targetSticheBox').style.display = 'none';
            saveCurrentInputs();
        }

        function updateTargetStiche() {
            const owner = document.getElementById('gameOwner').value;
            const bid = parseInt(document.getElementById('bidAmount').value) || 0;
            const inputWir = document.getElementById('meldWir').value;
            const inputDie = document.getElementById('meldDie').value;
            const displayName = (owner === 'Wir') ? nameWir : nameDie;
            
            updateBidDisplay();
            
            if ((owner === 'Wir' && inputWir === '') || (owner === 'Die' && inputDie === '')) {
                document.getElementById('targetSticheBox').style.display = 'none';
                return;
            }

            const meldWir = parseInt(inputWir) || 0;
            const meldDie = parseInt(inputDie) || 0;
            const activeMeldung = (owner === 'Wir') ? meldWir : meldDie;
            const neededStiche = bid - activeMeldung;
            const infoBox = document.getElementById('targetSticheBox');
            
            infoBox.style.display = 'block';
            if (neededStiche <= 0) {
                infoBox.innerHTML = `<strong>${displayName}</strong> hat das Spiel schon durch das Melden gewonnen! <br><span style="font-size:13px;color: var(--neon-green);">(Es muss nur noch mindestens 1 Stich gemacht werden)</span>`;
            } else if (neededStiche > 250) {
                infoBox.innerHTML = `<strong>${displayName}</strong> benötigt <span style="color: var(--neon-red);font-weight:bold;">${neededStiche}</span> Punkte aus Stichen.<br><span style="font-size:13px;color: var(--neon-red);font-weight:bold;">Das ist mathematisch unmöglich! (Max. 250)</span>`;
            } else {
                infoBox.innerHTML = `<strong>${displayName}</strong> benötigt mindestens <span style="color: var(--neon-blue);font-weight:bold;">${neededStiche}</span> Punkte aus Stichen (inkl. Letzter Stich).`;
            }
        }

        function goToPhase3() {
            document.getElementById('p2').style.display = 'none';
            document.getElementById('p3').style.display = 'block';
            saveCurrentInputs();
        }

        function handleSpecialGame(type) {
            activeSpecialType = type;
            const owner = document.getElementById('gameOwner').value;
            const displayName = (owner === 'Wir') ? nameWir : nameDie;
            const formattedType = type === 'durch' ? 'Durch' : 'Untendurch';
            
            document.getElementById('specialTitle').innerText = `Sonderprüfung: ${formattedType} (${displayName})`;
            document.getElementById('specialPrompt').innerText = `Hat ${displayName} das ${formattedType} geschafft?`;
            
            document.getElementById('p2').style.display = 'none';
            document.getElementById('pSpecial').style.display = 'block';
            saveCurrentInputs();
        }

        function evaluateSpecial(success) {
            const owner = document.getElementById('gameOwner').value;
            const bid = parseInt(document.getElementById('bidAmount').value) || 0;
            const value = activeSpecialType === 'durch' ? 1000 : 500;
            const displayName = (owner === 'Wir') ? nameWir : nameDie;
            
            let gewinnWir = 0;
            let gewinnDie = 0;
            let finalValue = success ? value : -value;

            if (owner === 'Wir') {
                gewinnWir = finalValue;
                gewinnDie = 0;
            } else {
                gewinnDie = finalValue;
                gewinnWir = 0;
            }

            const typeLabel = activeSpecialType === 'durch' ? 'Durch' : 'Untendurch';
            roundData = { wir: gewinnWir, die: gewinnDie, owner: owner, bid: bid, stotiert: false, verloren: !success, special: `${typeLabel} ${success ? 'Erfolgreich' : 'Fehlgeschlagen'}` };

            const statusBox = document.getElementById('resultStatus');
            if (success) {
                statusBox.className = "result-box success";
                statusBox.innerText = `${typeLabel} erfolgreich! ${displayName} verbucht +${value} Punkte.`;
            } else {
                statusBox.className = "result-box fail";
                statusBox.innerText = `${typeLabel} fehlgeschlagen! ${displayName} bekommt -${value} Punkte.`;
            }

            document.getElementById('roundGainWir').innerText = (gewinnWir >= 0 ? '+' : '') + gewinnWir;
            document.getElementById('roundGainDie').innerText = (gewinnDie >= 0 ? '+' : '') + gewinnDie;

            document.getElementById('pSpecial').style.display = 'none';
            document.getElementById('p4').style.display = 'block';
            saveCurrentInputs();
        }

        function handleStotiert() {
            const owner = document.getElementById('gameOwner').value;
            const bid = parseInt(document.getElementById('bidAmount').value) || 0;
            const meldWir = parseInt(document.getElementById('meldWir').value) || 0;
            const meldDie = parseInt(document.getElementById('meldDie').value) || 0;
            const displayName = (owner === 'Wir') ? nameWir : nameDie;

            let gewinnWir = 0;
            let gewinnDie = 0;

            if (owner === 'Wir') {
                gewinnWir = -bid;    
                gewinnDie = meldDie; 
            } else {
                gewinnDie = -bid;    
                gewinnWir = meldWir; 
            }

            roundData = { wir: gewinnWir, die: gewinnDie, owner: owner, bid: bid, stotiert: true, verloren: false, special: false };

            const statusBox = document.getElementById('resultStatus');
            statusBox.className = "result-box fail";
            statusBox.innerText = `${displayName} ist stotiert (abgegangen)! Gegner schreibt eigene gemeldete Punkte auf. ${displayName} bekommt den einfachen Reizwert (${bid}) abgezogen.`;

            document.getElementById('roundGainWir').innerText = (gewinnWir >= 0 ? '+' : '') + gewinnWir;
            document.getElementById('roundGainDie').innerText = (gewinnDie >= 0 ? '+' : '') + gewinnDie;

            document.getElementById('p2').style.display = 'none';
            document.getElementById('p4').style.display = 'block';
            saveCurrentInputs();
        }

        function calcPoints(changedTeam) {
            const inputWir = document.getElementById('pointsWir');
            const inputDie = document.getElementById('pointsDie');
            
            if (changedTeam === 'Wir') {
                let val = parseInt(inputWir.value);
                if (!isNaN(val) && val <= 240) inputDie.value = 240 - val;
            } else {
                let val = parseInt(inputDie.value);
                if (!isNaN(val) && val <= 240) inputWir.value = 240 - val;
            }
        }

        function recalcBoth() {
            const inputWir = document.getElementById('pointsWir').value;
            if(inputWir !== "") calcPoints('Wir');
        }

        function calculateResult() {
            const owner = document.getElementById('gameOwner').value;
            const bid = parseInt(document.getElementById('bidAmount').value) || 0;
            const meldWir = parseInt(document.getElementById('meldWir').value) || 0;
            const meldDie = parseInt(document.getElementById('meldDie').value) || 0;
            let sticheWir = parseInt(document.getElementById('pointsWir').value) || 0;
            let sticheDie = parseInt(document.getElementById('pointsDie').value) || 0;
            const last = document.getElementById('lastStich').value;
            const displayName = (owner === 'Wir') ? nameWir : nameDie;

            if (last === 'Wir') sticheWir += 10;
            else sticheDie += 10;

            let geholtWir = meldWir + sticheWir;
            let geholtDie = meldDie + sticheDie;
            
            let gewinnWir = 0;
            let gewinnDie = 0;
            let istErfolgreich = true;

            if (owner === 'Wir') {
                if (geholtWir >= bid && sticheWir > 0) {
                    gewinnWir = geholtWir;
                    gewinnDie = (sticheDie > 0) ? geholtDie : 0; 
                } else {
                    gewinnWir = -(bid * 2); 
                    gewinnDie = (sticheDie > 0) ? geholtDie : 0; 
                    istErfolgreich = false;
                }
            } else { 
                if (geholtDie >= bid && sticheDie > 0) {
                    gewinnDie = geholtDie;
                    gewinnWir = (sticheWir > 0) ? geholtWir : 0;
                } else {
                    gewinnDie = -(bid * 2); 
                    gewinnWir = (sticheWir > 0) ? geholtWir : 0; 
                    istErfolgreich = false;
                }
            }

            roundData = { wir: gewinnWir, die: gewinnDie, owner: owner, bid: bid, stotiert: false, verloren: !istErfolgreich, special: false };

            const statusBox = document.getElementById('resultStatus');
            if (istErfolgreich) {
                statusBox.className = "result-box success";
                statusBox.innerText = `Spiel gewonnen! ${displayName} hat das Ziel (${bid}) mit ${owner === 'Wir' ? geholtWir : geholtDie} Punkten erreicht.`;
            } else {
                statusBox.className = "result-box fail";
                statusBox.innerText = `Spiel im Nachhinein verloren! Ziel (${bid}) verfehlt. ${displayName} bekommt den REIZWERT DOPPELT abgezogen (${bid * 2}). Gegner schreibt normal.`;
            }

            document.getElementById('roundGainWir').innerText = (gewinnWir >= 0 ? '+' : '') + gewinnWir;
            document.getElementById('roundGainDie').innerText = (gewinnDie >= 0 ? '+' : '') + gewinnDie;

            document.getElementById('p3').style.display = 'none';
            document.getElementById('p4').style.display = 'block';
            saveCurrentInputs();
        }

        function applyAndReset() {
            totalWir += roundData.wir;
            totalDie += roundData.die;
            history.push(roundData);
            save();
            updateDisplay();

            document.getElementById('bidAmount').value = '';
            document.getElementById('meldWir').value = '';
            document.getElementById('meldDie').value = '';
            document.getElementById('pointsWir').value = '';
            document.getElementById('pointsDie').value = '';
            activeSpecialType = '';
            document.getElementById('targetSticheBox').style.display = 'none';
            document.getElementById('bidDisplay').innerText = 'Kein aktives Spiel';

            document.getElementById('p4').style.display = 'none';
            document.getElementById('p1').style.display = 'block';
            document.activeElement.blur();
            clearCurrentInputs();
        }

        function triggerNewGameSetup() {
            if (confirm("Gesamtes Match zurücksetzen und neue Namen vergeben?")) {
                totalWir = 0;
                totalDie = 0;
                history = [];
                clearCurrentInputs();
                
                document.getElementById('nameTeamWir').value = nameWir;
                document.getElementById('nameTeamDie').value = nameDie;
                
                save();
                
                document.getElementById('p1').style.display = 'none';
                document.getElementById('p2').style.display = 'none';
                document.getElementById('p3').style.display = 'none';
                document.getElementById('p4').style.display = 'none';
                document.getElementById('pSpecial').style.display = 'none';
                document.getElementById('targetSticheBox').style.display = 'none';
                document.getElementById('bidDisplay').innerText = 'Kein aktives Spiel';
                
                document.getElementById('p0').style.display = 'block';
            }
        }

        // Initiale Prüfung beim Laden
        if(localStorage.getItem('bp_name_wir')) {
            document.getElementById('p0').style.display = 'none';
            document.getElementById('p1').style.display = 'block';
            applyNamesToUI();
            updateDisplay();
            loadCurrentInputs();
        } else {
            document.getElementById('p0').style.display = 'block';
            document.getElementById('p1').style.display = 'none';
        }
    </script>
</body>
</html>
