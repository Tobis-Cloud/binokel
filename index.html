<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binokel Zähler - Modus wählen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Binokel">

    <link rel="icon" type="image/jpeg" href="Binokel.jpeg">
    <link rel="apple-touch-icon" type="image/jpeg" href="Binokel.jpeg">

    <style>
        /* SOFT MODERN NEON DESIGN TOKENS */
        :root {
            --bg-black: #050505;
            --neon-purple: #b666ff;
            --glow-purple: 0 0 15px rgba(182, 102, 255, 0.35), 0 0 35px rgba(182, 102, 255, 0.15);
            --glow-text-purple: 0 0 8px rgba(182, 102, 255, 0.5), 0 0 25px rgba(182, 102, 255, 0.2);
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-fast: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* BACKGROUND AMBIENT GLOW */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(182, 102, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* GLASS CONTAINER */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 2.8rem;
            border-radius: 28px;
            background: rgba(8, 8, 8, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #ffffff;
            text-shadow: var(--glow-text-purple);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-headline {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* BUTTON GROUP */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: transparent;
            border: 1px solid rgba(182, 102, 255, 0.5);
            color: #ffffff;
            border-radius: 14px;
            font-family: var(--font-family);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--glow-purple);
            text-shadow: 0 0 3px #ffffff;
            transition: all var(--transition-fast);
        }

        .btn:hover {
            background: rgba(182, 102, 255, 0.1);
            box-shadow: 0 0 25px rgba(182, 102, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 2.2rem 1.5rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <h1>Binokel Zähler</h1>
        <div class="sub-headline">Bitte Modus wählen</div>

        <div class="btn-group">
            <a href="binokel3.html" class="btn">3 Spieler</a>
            <a href="binokel4.html" class="btn">4 Spieler</a>
        </div>
    </div>

</body>
</html>
