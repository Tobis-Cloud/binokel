<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binokel Zähler - Modus wählen</title>
    
    <!-- Hier wird dein Logo für den Browser-Tab eingebunden -->
    <link rel="icon" type="image/jpeg" href="Binokel.jpeg">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ff9800;
        }
        .container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            display: inline-block;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #1e1e1e;
            border: 2px solid #ff9800;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #ff9800;
            color: black;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Willkommen beim Binokel-Zähler</h1>
    <p>Bitte wähle aus, wie viele Personen mitspielen:</p>

    <div class="container">
        <!-- Verlinkung zu deinen beiden Spiel-Seiten -->
        <a href="binokel3.html" class="btn">3 Spieler</a>
        <a href="binokel4.html" class="btn">4 Spieler</a>
    </div>

</body>
</html>
